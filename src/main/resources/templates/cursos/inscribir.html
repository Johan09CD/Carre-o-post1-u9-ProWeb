<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inscribir Estudiante</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 650px; margin: 0 auto; }
        h1 { color: white; font-size: 26px; margin-bottom: 5px; }
        .subtitle { color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 30px; }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
        }
        .card h3 { color: rgba(255,255,255,0.8); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .badge-est {
            display: inline-block;
            background: rgba(46,213,115,0.2);
            color: #2ed573;
            border: 1px solid rgba(46,213,115,0.3);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin: 4px;
        }
        .empty { color: rgba(255,255,255,0.3); font-style: italic; font-size: 13px; }
        .student-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .student-row:last-child { border-bottom: none; }
        .student-name { color: white; font-size: 14px; }
        .student-email { color: rgba(255,255,255,0.4); font-size: 12px; }
        .btn {
            padding: 7px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.3s;
        }
        .btn-inscribir { background: rgba(46,213,115,0.2); color: #2ed573; border: 1px solid rgba(46,213,115,0.3); }
        .btn-back {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 13px;
        }
        .btn:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Inscribir Estudiante</h1>
        <p class="subtitle">Curso: <strong style="color:white" th:text="${curso.nombre}"></strong></p>

        <div class="card">
            <h3>✓ Inscritos actualmente</h3>
            <div th:if="${!#sets.isEmpty(curso.estudiantes)}">
                <span th:each="est : ${curso.estudiantes}" class="badge-est"
                      th:text="${est.nombre} + ' ' + ${est.apellido}"></span>
            </div>
            <p th:if="${#sets.isEmpty(curso.estudiantes)}" class="empty">Sin estudiantes inscritos aún.</p>
        </div>

        <div class="card">
            <h3>+ Agregar estudiante</h3>
            <div th:each="estudiante : ${estudiantes}">
                <div th:if="${!curso.estudiantes.contains(estudiante)}" class="student-row">
                    <div>
                        <div class="student-name" th:text="${estudiante.nombre} + ' ' + ${estudiante.apellido}"></div>
                        <div class="student-email" th:text="${estudiante.email}"></div>
                    </div>
                    <form th:action="@{'/cursos/' + ${curso.id} + '/inscribir/' + ${estudiante.id}}" method="post">
                        <button type="submit" class="btn btn-inscribir">+ Inscribir</button>
                    </form>
                </div>
            </div>
            <p th:if="${#sets.size(curso.estudiantes) == #lists.size(estudiantes)}" class="empty">
                Todos los estudiantes ya están inscritos.
            </p>
        </div>

        <a href="/cursos" class="btn-back">← Volver a Cursos</a>
    </div>
</body>
</html>
