<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Estudiantes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { color: white; font-size: 28px; }
        .subtitle { color: rgba(255,255,255,0.5); font-size: 14px; margin-top: 4px; }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
        }
        table { width: 100%; border-collapse: collapse; }
        thead tr { border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { color: rgba(255,255,255,0.5); font-size: 12px; text-transform: uppercase; padding: 12px 15px; text-align: left; }
        td { color: white; font-size: 14px; padding: 14px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.03); }
        .btn {
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            border: none;
            transition: opacity 0.3s;
            display: inline-block;
            margin-right: 5px;
        }
        .btn-new {
            background: linear-gradient(135deg, #e94560, #c23152);
            color: white;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 10px;
        }
        .btn-edit { background: rgba(99,102,241,0.2); color: #818cf8; border: 1px solid rgba(99,102,241,0.3); }
        .btn-delete { background: rgba(233,69,96,0.2); color: #e94560; border: 1px solid rgba(233,69,96,0.3); }
        .btn-back {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 13px;
        }
        .btn:hover { opacity: 0.8; }
        .badge-carrera {
            background: rgba(99,102,241,0.2);
            color: #818cf8;
            border: 1px solid rgba(99,102,241,0.3);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🎓 Estudiantes</h1>
                <p class="subtitle">Gestión de estudiantes registrados</p>
            </div>
            <a href="/estudiantes/nuevo" class="btn btn-new">+ Nuevo Estudiante</a>
        </div>
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Carrera</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="est : ${estudiantes}">
                        <td th:text="${est.id}"></td>
                        <td th:text="${est.nombre} + ' ' + ${est.apellido}"></td>
                        <td th:text="${est.email}"></td>
                        <td><span class="badge-carrera" th:text="${est.carrera}"></span></td>
                        <td>
                            <a th:href="@{'/estudiantes/editar/' + ${est.id}}" class="btn btn-edit">✏ Editar</a>
                            <a th:href="@{'/estudiantes/eliminar/' + ${est.id}}" class="btn btn-delete">🗑 Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <a th:href="@{/dashboard}" class="btn-back">← Volver al Dashboard</a>
    </div>
</body>
</html>
