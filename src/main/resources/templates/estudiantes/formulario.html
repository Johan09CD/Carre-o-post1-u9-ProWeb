<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Estudiante</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            width: 440px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #e94560; font-size: 24px; }
        .logo p { color: rgba(255,255,255,0.5); font-size: 13px; margin-top: 5px; }
        .form-group { margin-bottom: 18px; }
        label { color: rgba(255,255,255,0.7); font-size: 13px; display: block; margin-bottom: 8px; }
        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }
        input:focus { border-color: #e94560; }
        .error { color: #e94560; font-size: 12px; margin-top: 5px; display: block; }
        .actions { display: flex; gap: 10px; margin-top: 5px; }
        .btn {
            flex: 1;
            padding: 13px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            border: none;
            transition: opacity 0.3s;
        }
        .btn-save { background: linear-gradient(135deg, #e94560, #c23152); color: white; }
        .btn-cancel {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.7);
        }
        .btn:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h1>🎓 <span th:text="${titulo}">Estudiante</span></h1>
            <p>Completa los datos del estudiante</p>
        </div>
        <form th:action="@{/estudiantes/guardar}" th:object="${estudiante}" method="post">
            <input type="hidden" th:field="*{id}" />
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" th:field="*{nombre}" placeholder="Nombre" />
                <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error"></span>
            </div>
            <div class="form-group">
                <label>Apellido</label>
                <input type="text" th:field="*{apellido}" placeholder="Apellido" />
                <span th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}" class="error"></span>
            </div>
            <div class="form-group">
                <label>Correo electrónico</label>
                <input type="email" th:field="*{email}" placeholder="correo@ejemplo.com" />
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></span>
            </div>
            <div class="form-group">
                <label>Carrera</label>
                <input type="text" th:field="*{carrera}" placeholder="Ej: Ingeniería de Sistemas" />
                <span th:if="${#fields.hasErrors('carrera')}" th:errors="*{carrera}" class="error"></span>
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-save">Guardar</button>
                <a href="/estudiantes" class="btn btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
