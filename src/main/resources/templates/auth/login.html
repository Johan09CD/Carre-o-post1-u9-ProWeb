<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            width: 380px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #e94560; font-size: 28px; letter-spacing: 2px; }
        .logo p { color: rgba(255,255,255,0.5); font-size: 13px; margin-top: 5px; }
        .alert {
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .alert-error { background: rgba(233,69,96,0.2); color: #e94560; border: 1px solid rgba(233,69,96,0.3); }
        .alert-success { background: rgba(46,213,115,0.2); color: #2ed573; border: 1px solid rgba(46,213,115,0.3); }
        .form-group { margin-bottom: 20px; }
        label { color: rgba(255,255,255,0.7); font-size: 13px; display: block; margin-bottom: 8px; }
        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }
        input:focus { border-color: #e94560; }
        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #e94560, #c23152);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 5px;
        }
        button:hover { opacity: 0.9; }
        .link { text-align: center; margin-top: 20px; }
        .link a { color: #e94560; text-decoration: none; font-size: 13px; }
        .link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h1>🔐 SecureApp</h1>
            <p>Sistema de Autenticación UDES</p>
        </div>
        <form th:action="@{/login}" method="post">
            <div th:if="${param.error}" class="alert alert-error">
                ✕ Correo o contraseña incorrectos.
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                ✓ Sesión cerrada correctamente.
            </div>
            <div th:if="${param.registrado}" class="alert alert-success">
                ✓ Registro exitoso. Inicie sesión.
            </div>
            <div class="form-group">
                <label>Correo electrónico</label>
                <input type="email" name="username" placeholder="correo@ejemplo.com" required />
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" placeholder="••••••••" required />
            </div>
            <button type="submit">Ingresar</button>
        </form>
        <div class="link">
            <a th:href="@{/registro}">¿No tiene cuenta? Registrarse</a>
        </div>
    </div>
</body>
</html>
